# ==============================================================================
# DashPark Configuration File (v0.0.1)
# Documentation: https://github.com/jack11122233311/DashPark
# ==============================================================================

version: "0.0.1"

meta:
  title: "DashPark"
  subtitle: "Personal Homelab & Server Park"
  logo: "" # Leave empty for default DashPark icon, or specify custom image path / URL
  theme: "dark" # Options: dark, light, nord, dracula, cyberpunk, glass
  accentColor: "#6366f1" # Primary brand accent color (hex)
  layout: "grid" # Options: grid, bento, compact
  showClock: true
  clockFormat: "24h" # Options: 12h, 24h
  searchEngine:
    enabled: true
    provider: "duckduckgo" # Options: duckduckgo, google, brave, custom
    customUrl: ""

# ==============================================================================
# Categories & Services
# ==============================================================================
categories:
  - id: "media"
    name: "Media & Streaming"
    icon: "film"
    columns: 4
    services:
      - id: "plex"
        name: "Plex Media Server"
        url: "http://plex.local:32400"
        icon: "plex"
        description: "Movies, TV Shows & Music Streaming"
        pingUrl: "http://plex.local:32400/web/index.html"
        target: "_blank"
        tags: ["media", "streaming"]

      - id: "jellyfin"
        name: "Jellyfin"
        url: "http://jellyfin.local:8096"
        icon: "jellyfin"
        description: "Free Software Media System"
        pingUrl: "http://jellyfin.local:8096"
        target: "_blank"
        tags: ["media", "opensource"]

      - id: "sonarr"
        name: "Sonarr"
        url: "http://sonarr.local:8989"
        icon: "sonarr"
        description: "TV Series Collection Manager"
        target: "_blank"

      - id: "radarr"
        name: "Radarr"
        url: "http://radarr.local:7878"
        icon: "radarr"
